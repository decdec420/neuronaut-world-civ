name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and sim check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the Docker image runs; 3.9 is the Python macOS ships with
        python: ["3.13", "3.9"]
    steps:
      - uses: actions/checkout@v4
      # uv, not setup-python: setup-python has no 3.9 for the current
      # ubuntu-latest, and uv's Python builds cover every version here
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          source .venv/bin/activate
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          python --version
      - name: Tests
        run: pytest -q
      - name: Sim check, dawn of time (1200 ticks x 3 seeds; must print OVERALL PASS)
        run: python scripts/sim_check.py --start dawn
      - name: Sim check, settlers (1200 ticks x 3 seeds; must print OVERALL PASS)
        run: python scripts/sim_check.py --start settlers

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t neuronaut-world:ci .
      - name: Run read-only and check it serves
        run: |
          docker run -d --name nw --read-only --tmpfs /tmp -v nw-data:/data \
            -p 8000:8000 -e NEURONAUT_ADMIN_TOKEN=ci-token neuronaut-world:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/health && break
            sleep 1
          done
          curl -fsS localhost:8000/health
          curl -fsS -o /dev/null localhost:8000/app
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/simulation/pause -H 'X-Neuronaut-Control: 1')" = 401
          curl -fsS -X POST localhost:8000/saves -H 'X-Neuronaut-Control: 1' \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' -d '{"name":"ci"}'
      - name: Logs
        if: always()
        run: docker logs nw 2>&1 | tail -50
