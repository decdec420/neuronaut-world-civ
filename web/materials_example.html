<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials System - Neuronaut World</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* Category Cards Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .category-card.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .category-name {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .category-count {
            font-size: 2em;
            font-weight: 700;
            opacity: 0.9;
        }

        .category-label {
            opacity: 0.7;
            font-size: 0.9em;
        }

        /* Detailed Materials View */
        .detailed-view {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
        }

        .detailed-view.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .detail-title {
            font-size: 2em;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .material-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
        }

        .material-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .material-name {
            font-size: 1.4em;
            font-weight: 600;
        }

        .material-hardness {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .material-description {
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .material-properties {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .property-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85em;
        }

        .material-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .back-to-categories {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Materials System</h1>
        <p class="subtitle">Click on a category to view detailed materials</p>

        <!-- Category Cards (Overview) -->
        <div id="categoryGrid" class="category-grid"></div>

        <!-- Detailed View -->
        <div id="detailedView" class="detailed-view">
            <div class="detail-header">
                <div class="detail-title" id="detailTitle"></div>
                <button class="close-btn" onclick="closeDetailedView()">✕ Close</button>
            </div>
            <div id="materialsGrid" class="materials-grid"></div>
        </div>
    </div>

    <script>
        let categoriesData = {};

        // Load categories on page load
        async function loadCategories() {
            const response = await fetch('/materials');
            const data = await response.json();
            categoriesData = data.categories;
            renderCategoryCards();
        }

        function renderCategoryCards() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';

            for (const [categoryId, categoryData] of Object.entries(categoriesData)) {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => openCategory(categoryId, categoryData.name);

                card.innerHTML = `
                    <div class="category-name">${categoryData.name}</div>
                    <div class="category-count">${categoryData.count}</div>
                    <div class="category-label">materials</div>
                `;

                grid.appendChild(card);
            }
        }

        async function openCategory(categoryId, categoryName) {
            // Fetch detailed category data
            const response = await fetch(`/materials/${categoryId}`);
            const data = await response.json();

            // Update title
            document.getElementById('detailTitle').textContent = categoryName;

            // Render materials
            const materialsGrid = document.getElementById('materialsGrid');
            materialsGrid.innerHTML = '';

            data.materials.forEach(material => {
                const card = document.createElement('div');
                card.className = 'material-card';

                // Build properties badges
                const properties = [];
                if (material.flammable) properties.push('🔥 Flammable');
                if (material.edible) properties.push('🍽️ Edible');
                if (material.liquid) properties.push('💧 Liquid');

                const propertiesHTML = properties.length > 0
                    ? `<div class="material-properties">
                        ${properties.map(p => `<div class="property-badge">${p}</div>`).join('')}
                       </div>`
                    : '';

                // Build tags
                const tagsHTML = material.tags.length > 0
                    ? `<div class="material-tags">
                        ${material.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                       </div>`
                    : '';

                card.innerHTML = `
                    <div class="material-header">
                        <div class="material-name">${material.name}</div>
                        <div class="material-hardness">⚡ ${material.hardness.toFixed(1)}</div>
                    </div>
                    <div class="material-description">${material.description}</div>
                    ${propertiesHTML}
                    ${tagsHTML}
                `;

                materialsGrid.appendChild(card);
            });

            // Show detailed view
            document.getElementById('detailedView').classList.add('active');

            // Mark active category
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
            event.target.closest('.category-card').classList.add('active');
        }

        function closeDetailedView() {
            document.getElementById('detailedView').classList.remove('active');
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
        }

        // Load on page start
        loadCategories();
    </script>
</body>
</html>
